<link rel="stylesheet" href="style.css">
<style>
  .card {
    max-width: 420px;
    margin: 24px auto;
    padding: 28px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  }

  .card h1,
  .card > p:first-of-type,
  .card > p:last-of-type {
    text-align: center;
  }

  .card label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
  }

  .card input,
  .card select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  .card button {
    margin-top: 8px;
    padding: 8px 14px;
    background:#163a5f;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .card button.button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: #163a5f;
    color: #fff;
    font-size: 15px;
  }
</style>
</head>

<main>
<section class="card">
<h1>เข้าสู่ระบบ</h1>
<p>ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา</p>

<form>
<label for="username">ชื่อผู้ใช้</label>
<input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>

<label for="password">รหัสผ่าน</label>
<input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
<button type="button">แสดง</button>

<label for="role">ประเภทผู้ใช้งาน</label>
<select id="role">
<option value="user">สมาชิก (User)</option>
<option value="admin">ผู้ดูแลระบบ (Admin)</option>
</select>

<button type="submit" class="button">เข้าสู่ระบบ</button>
</form>

<p>บัญชีทดลองสำหรับฝึกปฏิบัติ: admin / admin123</p>
</section>
</main>
